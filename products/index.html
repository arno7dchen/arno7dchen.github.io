<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Products</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{padding:20px;max-width:1200px;margin:0 auto;}
        .category-menu{margin-bottom:30px;display:flex;gap:10px;flex-wrap:wrap;}
        .category-btn{padding:8px 16px;border:none;background:#eee;border-radius:4px;cursor:pointer;}
        .category-btn.active{background:#222;color:#fff;}
        .product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px;}
        .product-card{border:1px solid #eee;padding:10px;border-radius:6px;}
        .product-card img{width:100%;height:200px;object-fit:cover;border-radius:4px;}
        .product-card h3{margin-top:10px;font-size:14px;text-align:center;}
    </style>
</head>
<body>
    <h2 style="margin-bottom:20px">Garden Outdoor Furniture</h2>
    <!-- 左侧分类菜单 -->
    <div class="category-menu">
      <button class="category-btn active" data-category="all">All Products</button>
      <button class="category-btn" data-category="garden-furniture-sets">Garden Furniture Sets</button>
      <button class="category-btn" data-category="rattan-furniture-sets">Rattan Furniture Sets</button>
    </div>

    <!-- 产品列表 -->
    <div class="product-grid">
      <!-- 1 -->
      <div class="product-card" data-category="garden-furniture-sets">
        <img src="../images/garden-furniture-sets-4pc-patio-conversationset.webp" alt="4pc Patio Conversation Set">
        <h3>4pc Patio Conversation Set</h3>
      </div>
      <!-- 2 -->
      <div class="product-card" data-category="garden-furniture-sets">
        <img src="../images/garden-furniture-sets-3pc-patio-bistro-set.webp" alt="3pc Patio Bistro Set">
        <h3>3pc Patio Bistro Set</h3>
      </div>
      <!-- 3 -->
      <div class="product-card" data-category="garden-furniture-sets">
        <img src="../images/garden-furniture-sets-3pc-patio-bistro-set.webp" alt="3pc Patio Bistro Set">
        <h3>3pc Patio Bistro Set</h3>
      </div>
      <!-- 4 -->
      <div class="product-card" data-category="garden-furniture-sets">
        <img src="../images/garden-furniture-sets-3pc-patio-bistro-set.webp" alt="3pc Patio Bistro Set">
        <h3>3pc Patio Bistro Set</h3>
      </div>
      <!-- 5 -->
      <div class="product-card" data-category="garden-furniture-sets">
        <img src="../images/garden-furniture-sets-4pc-patio-conversationset.webp" alt="4pc Patio Conversation Set">
        <h3>4pc Patio Conversation Set</h3>
      </div>
      <!-- 6 -->
      <div class="product-card" data-category="garden-furniture-sets">
        <img src="../images/garden-furniture-sets-4pc-patio-conversationset.webp" alt="4pc Patio Conversation Set">
        <h3>4pc Patio Conversation Set</h3>
      </div>
      <!-- 7 -->
      <div class="product-card" data-category="garden-furniture-sets">
        <img src="../images/garden-furniture-sets-4pc-patio-conversationset.webp" alt="4pc Patio Conversation Set">
        <h3>4pc Patio Conversation Set</h3>
      </div>
      <!-- 8 -->
      <div class="product-card" data-category="rattan-furniture-sets">
        <img src="../images/rattan-furniture-sets-4pc-patio-conversationset.webp" alt="Rattan 4pc Patio Conversation Set">
        <h3>Rattan 4pc Patio Conversation Set</h3>
      </div>
      <!-- 9 -->
      <div class="product-card" data-category="rattan-furniture-sets">
        <img src="../images/rattan-furniture-sets-4pc-patio-conversationset.webp" alt="Rattan 4pc Patio Conversation Set">
        <h3>Rattan 4pc Patio Conversation Set</h3>
      </div>
    </div>

<!-- 分类筛选JS -->
<script>
const categoryButtons = document.querySelectorAll('.category-btn');
const productCards = document.querySelectorAll('.product-card');

categoryButtons.forEach(button => {
  button.addEventListener('click', () => {
    const selectedCategory = button.dataset.category;
    categoryButtons.forEach(btn => btn.classList.remove('active'));
    button.classList.add('active');

    productCards.forEach(card => {
      if (selectedCategory === 'all' || card.dataset.category === selectedCategory) {
        card.style.display = 'block';
      } else {
        card.style.display = 'none';
      }
    });
  });
});
</script>
</body>
</html>
