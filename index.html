<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunburst Outdoor Products</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }
        /* 统一导航样式 */
        .site-header {
            position: absolute;
            width: 100%;
            top: 0;
            background: rgba(0,0,0,0.3);
            padding: 16px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }
        .site-header .logo {
            color: #fff;
            font-size: 16px;
            font-weight: 500;
        }
        .site-header .nav a {
            color: #fff;
            text-decoration: none;
            margin-left: 30px;
            font-size: 16px;
            transition: color 0.2s ease;
        }
        .site-header .nav a.active {
            color: #ff6b35;
        }
        .site-header .nav a:hover {
            color: #ff6b35;
        }
        /* 下方原有页面样式原样保留 */
    </style>
</head>
<body>
    <header class="site-header">
        <div class="logo">Sunburst Outdoor Products Co., Ltd</div>
        <nav class="nav">
            <a href="./" class="active">Home</a>
            <a href="./about/index.html">About Us</a>
            <a href="./products/index.html">Products</a>
            <a href="./contact/index.html">Contact Us</a>
        </nav>
    </header>

    <!-- 此处保留你原本首页所有内容、图片、文字 -->
</body>
</html>
