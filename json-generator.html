<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>一键拖拽生成JSON工具</title>

<style>
body {
    font-family: Arial;
    padding: 20px;
}

.drop-zone {
    border: 2px dashed #aaa;
    padding: 40px;
    text-align: center;
    margin-bottom: 20px;
    color: #666;
}

.grid {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

.item {
    width: 120px;
    height: 120px;
    border: 1px solid #ddd;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f7f7f7;
    flex-direction: column;
    font-size: 12px;
}

.item img {
    max-width: 100%;
    max-height: 80px;
}

button {
    margin-top: 20px;
    padding: 10px 15px;
    background: black;
    color: white;
    border: none;
    cursor: pointer;
}

pre {
    margin-top: 20px;
    background: #f5f5f5;
    padding: 15px;
}
</style>
</head>

<body>

<h2>🚀 一键拖拽生成 JSON</h2>

<div class="drop-zone" id="dropZone">
拖拽【产品文件夹里的图片】到这里
</div>

<div class="grid" id="preview"></div>

<button onclick="generateJSON()">生成JSON</button>

<pre id="output"></pre>

<script>

let files = [];

// 拖拽
const dropZone = document.getElementById("dropZone");

dropZone.ondragover = e => e.preventDefault();

dropZone.ondrop = e => {
    e.preventDefault();

    const list = Array.from(e.dataTransfer.files);

    list.forEach(file => {

        if (!file.type.startsWith("image")) return;

        files.push(file);
    });

    render();
};

// 渲染预览
function render() {

    const box = document.getElementById("preview");
    box.innerHTML = "";

    files
        .sort((a, b) => a.name.localeCompare(b.name))
        .forEach((file, index) => {

        const div = document.createElement("div");
        div.className = "item";

        const img = document.createElement("img");
        img.src = URL.createObjectURL(file);

        const label = document.createElement("div");
        label.innerText = file.name;

        div.appendChild(img);
        div.appendChild(label);

        box.appendChild(div);
    });
}

// 生成JSON
function generateJSON() {

    const productId = prompt("请输入产品ID（例如 S-OC-001）");

    if (!productId) return;

    const images = files
        .sort((a, b) => a.name.localeCompare(b.name))
        .map(f => f.name);

    const json = {
        id: productId,
        images: images
    };

    document.getElementById("output").innerText =
        JSON.stringify(json, null, 2);
}

</script>

</body>
</html>
