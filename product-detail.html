<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Product Detail</title>

<style>
body { font-family: Arial; margin: 20px; }

.container {
    max-width: 900px;
    margin: auto;
}

/* ===== 图片网格 ===== */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 10px;
}

/* 每张图统一容器（关键：避免大小不一） */
.img-box {
    width: 100%;
    height: 160px;
    background: #f5f5f5;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    overflow: hidden;
}

/* 图片本体（不裁切） */
.img-box img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    cursor: pointer;
    transition: 0.2s;
}

.img-box img:hover {
    transform: scale(1.03);
}

/* ===== lightbox（放大层）===== */
#lightbox {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.85);
    justify-content: center;
    align-items: center;
    z-index: 9999;
}

#lightbox img {
    max-width: 90%;
    max-height: 90%;
}

/* info */
.info { margin-top: 20px; }

button {
    margin-top: 20px;
    padding: 10px 20px;
    background: black;
    color: white;
    border: none;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="container">

    <h1 id="title"></h1>
    <p id="code"></p >

    <div class="grid" id="images"></div>

    <div class="info">
        <p><b>Material:</b> <span id="material"></span></p >
        <p><b>Dimensions:</b> <span id="dimensions"></span></p >
        <p id="description"></p >
    </div>

    <button onclick="inquiry()">Send Inquiry</button>
</div>

<!-- lightbox 必须存在（你之前问题就是缺/错/重复） -->
<div id="lightbox">
    < img id="lightboxImg">
</div>

<script>

// =======================
// 1. 产品数据（测试）
// =======================
const product = {
    id: "S-OC-001",
    name: "Outdoor Dining Chair",
    material: "Aluminum + Textilene",
    dimensions: "W58 × D62 × H88 cm",
    description: "Modern outdoor chair suitable for garden and patio use.",
    images: [
        "images/products/S-OC-001/1.jpg",
        "images/products/S-OC-001/2.jpg",
        "images/products/S-OC-001/3.jpg",
        "images/products/S-OC-001/4.jpg",
        "images/products/S-OC-001/5.jpg",
        "images/products/S-OC-001/6.jpg"
    ]
};

// =======================
// 2. 填充文字
// =======================
document.getElementById("title").innerText = product.name;
document.getElementById("code").innerText = product.id;
document.getElementById("material").innerText = product.material;
document.getElementById("dimensions").innerText = product.dimensions;
document.getElementById("description").innerText = product.description;

// =======================
// 3. 渲染图片 + 点击放大
// =======================
const imgBox = document.getElementById("images");
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightboxImg");

product.images.forEach(src => {

    const box = document.createElement("div");
    box.className = "img-box";

    const img = document.createElement("img");
    img.src = src;

    img.onclick = () => {
        lightbox.style.display = "flex";
        lightboxImg.src = src;
    };

    box.appendChild(img);
    imgBox.appendChild(box);
});

// =======================
// 4. 关闭 lightbox
// =======================
lightbox.onclick = () => {
    lightbox.style.display = "none";
};

// =======================
// 5. inquiry
// =======================
function inquiry() {
    alert("Inquiry sent for " + product.id);
}

</script>

</body>
</html>
