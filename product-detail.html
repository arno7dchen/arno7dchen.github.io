<!DOCTYPE html>
<html lang="en">
<head>
<!-- 统一终极版 Favicon（所有页面通用） -->
<link rel="icon" href="https://sunburstltd.com/favicon.png?v=5" type="image/png">
<link rel="shortcut icon" href="https://sunburstltd.com/favicon.png?v=5" type="image/png">
<link rel="apple-touch-icon" href="https://sunburstltd.com/favicon.png?v=5">
<link rel="mask-icon" href="https://sunburstltd.com/favicon.png?v=5" color="#ffffff">
<meta name="theme-color" content="#ffffff">  
<meta charset="UTF-8">
<title>Product Detail</title>

<style>
body {
    font-family: Arial;
    margin: 20px;
}

.container {
    max-width: 900px;
    margin: auto;
}

h1 { margin-bottom: 10px; }

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 12px;
}

.img-box {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #fff;
    border: 1px solid #eee;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.img-box img {
    max-width: 90%;
    max-height: 90%;
    object-fit: contain;
    cursor: pointer;
}

#lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    justify-content: center;
    align-items: center;
    z-index: 9999;
}

#lightbox img {
    max-width: 90%;
    max-height: 90%;
}

/* 询盘弹窗 */
#inquiryBox {
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.6);
}

#inquiryInner {
    background:#fff;
    width:320px;
    margin:100px auto;
    padding:20px;
    border-radius:8px;
}

input, textarea {
    width:100%;
    margin:5px 0;
    padding:8px;
}
</style>
</head>

<body>

<div class="container">

    <h1 id="title"></h1>
    <p id="code"></p >

    <div class="grid" id="images"></div>

    <div>
        <p><b>Material:</b> <span id="material"></span></p >
        <p><b>Dimensions:</b> <span id="dimensions"></span></p >
        <p id="description"></p >
    </div>

    <button onclick="openInquiry()">Send Inquiry</button>

</div>

<!-- lightbox -->
<div id="lightbox">
    < img id="lightboxImg">
</div>

<!-- inquiry -->
<div id="inquiryBox">
  <div id="inquiryInner">

    <h3>Inquiry</h3>

    <input id="inq_name" placeholder="Name">
    <input id="inq_email" placeholder="Email">
    <input id="inq_country" placeholder="Country">
    <textarea id="inq_msg" placeholder="Message"></textarea>

    <button onclick="sendInquiry()">Send</button>
    <button onclick="closeInquiry()">Close</button>

  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const productId = params.get("id") || "S-OC-001";

let product = null;

/* ======================
   1. LOAD PRODUCT JSON
====================== */
fetch(`/data/products/${productId}.json`)
  .then(res => res.json())
  .then(data => {
      product = data;
      renderProduct();
  });

/* ======================
   2. RENDER PRODUCT
====================== */
function renderProduct() {

    document.getElementById("title").innerText = product.name;
    document.getElementById("code").innerText = product.id;
    document.getElementById("material").innerText = product.material;
    document.getElementById("dimensions").innerText = product.dimensions;
    document.getElementById("description").innerText = product.description;

    const imgBox = document.getElementById("images");
    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightboxImg");

    imgBox.innerHTML = "";

    product.images.forEach(imgName => {

        const box = document.createElement("div");
        box.className = "img-box";

        const img = document.createElement("img");
        img.src = `/images/products/${product.id}/${imgName}`;

        img.onclick = () => {
            lightbox.style.display = "flex";
            lightboxImg.src = img.src;
        };

        box.appendChild(img);
        imgBox.appendChild(box);
    });

    lightbox.onclick = () => {
        lightbox.style.display = "none";
    };
}

/* ======================
   3. INQUIRY SYSTEM
====================== */

function openInquiry(){
    document.getElementById("inquiryBox").style.display = "block";
}

function closeInquiry(){
    document.getElementById("inquiryBox").style.display = "none";
}

function sendInquiry(){

    fetch("https://formspree.io/f/mjgddevd", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            product_id: product.id,
            product_name: product.name,
            name: document.getElementById("inq_name").value,
            email: document.getElementById("inq_email").value,
            country: document.getElementById("inq_country").value,
            message: document.getElementById("inq_msg").value,
            page_url: window.location.href,
            time: new Date().toISOString()
        })
    })
    .then(res => {
        if (res.ok) {
            alert("Inquiry sent successfully!");
            closeInquiry();
        } else {
            alert("Failed to send inquiry");
        }
    })
    .catch(err => {
        console.error(err);
        alert("Network error");
    });
}

</script>

</body>
</html>
