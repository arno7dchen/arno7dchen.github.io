<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Product Detail</title>

<style>

body {
    font-family: Arial;
    margin: 20px;
}

.container {
    max-width: 900px;
    margin: auto;
}

/* ===== 标题 ===== */
h1 {
    margin-bottom: 10px;
}

/* ===== 信息 ===== */
.info {
    margin-top: 20px;
}

/* ===== 图片区域（核心重构）===== */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 12px;
}

/* ⭐彻底去掉灰色，统一白底 */
.img-box {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #fff;

    border: 1px solid #eee;
    border-radius: 8px;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;
}

/* 图片统一适配（不裁切） */
.img-box img {
    max-width: 90%;
    max-height: 90%;
    object-fit: contain;

    cursor: pointer;
    transition: 0.25s ease;
}

.img-box img:hover {
    transform: scale(1.05);
}

/* ===== 按钮 ===== */
button {
    margin-top: 20px;
    padding: 10px 20px;
    background: black;
    color: white;
    border: none;
    cursor: pointer;
    border-radius: 4px;
}

/* ===== Lightbox ===== */
#lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);

    justify-content: center;
    align-items: center;
    z-index: 9999;
}

#lightbox img {
    max-width: 90%;
    max-height: 90%;
    object-fit: contain;
}

</style>
</head>

<body>

<div class="container">

    <h1 id="title"></h1>
    <p id="code"></p >

    <div class="grid" id="images"></div>

    <div class="info">
        <p><b>Material:</b> <span id="material"></span></p >
        <p><b>Dimensions:</b> <span id="dimensions"></span></p >
        <p id="description"></p >
    </div>

    <button onclick="inquiry()">Send Inquiry</button>

</div>

<!-- Lightbox（必须存在） -->
<div id="lightbox">
    <img id="lightboxImg">
</div>

<script>
const params = new URLSearchParams(window.location.search);
const productId = params.get("id") || "S-OC-001";

let product = null;

// =========================
// 1. 加载 JSON
// =========================
fetch(`/data/products/${productId}.json`)
  .then(res => {
      if (!res.ok) throw new Error("JSON not found");
      return res.json();
  })
  .then(data => {
      product = data;
      render();
  })
  .catch(err => {
      console.error(err);
      document.body.innerHTML = "<h2>Product Not Found</h2>";
  });

// =========================
// 2. 渲染
// =========================
function render() {

    document.getElementById("title").innerText = product.name;
    document.getElementById("code").innerText = product.id;
    document.getElementById("material").innerText = product.material;
    document.getElementById("dimensions").innerText = product.dimensions;
    document.getElementById("description").innerText = product.description;

    const imgBox = document.getElementById("images");
    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightboxImg");

    imgBox.innerHTML = "";

    const base = `/images/products/${product.id}/`;

    product.images.forEach((imgName) => {

        const wrapper = document.createElement("div");
        wrapper.className = "img-box";

        const img = document.createElement("img");
        img.src = base + imgName;

        // ❗防止404导致灰层
        img.onerror = () => {
            wrapper.style.display = "none";
        };

        img.onclick = () => {
            lightbox.style.display = "flex";
            lightboxImg.src = img.src;
        };

        wrapper.appendChild(img);
        imgBox.appendChild(wrapper);
    });

    // ❗只绑定一次（关键）
    lightbox.onclick = () => {
        lightbox.style.display = "none";
    };
}
</script>

</body>
</html>
