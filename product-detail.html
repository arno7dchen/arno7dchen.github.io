<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Product Detail</title>

<style>

body {
    font-family: Arial;
    margin: 20px;
}

.container {
    max-width: 900px;
    margin: auto;
}

/* ===== 标题 ===== */
h1 {
    margin-bottom: 10px;
}

/* ===== 信息 ===== */
.info {
    margin-top: 20px;
}

/* ===== 图片区域（核心重构）===== */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 12px;
}

/* ⭐彻底去掉灰色，统一白底 */
.img-box {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #fff;

    border: 1px solid #eee;
    border-radius: 8px;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;
}

/* 图片统一适配（不裁切） */
.img-box img {
    max-width: 90%;
    max-height: 90%;
    object-fit: contain;

    cursor: pointer;
    transition: 0.25s ease;
}

.img-box img:hover {
    transform: scale(1.05);
}

/* ===== 按钮 ===== */
button {
    margin-top: 20px;
    padding: 10px 20px;
    background: black;
    color: white;
    border: none;
    cursor: pointer;
    border-radius: 4px;
}

/* ===== Lightbox ===== */
#lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);

    justify-content: center;
    align-items: center;
    z-index: 9999;
}

#lightbox img {
    max-width: 90%;
    max-height: 90%;
    object-fit: contain;
}

</style>
</head>

<body>

<div class="container">

    <h1 id="title"></h1>
    <p id="code"></p >

    <div class="grid" id="images"></div>

    <div class="info">
        <p><b>Material:</b> <span id="material"></span></p >
        <p><b>Dimensions:</b> <span id="dimensions"></span></p >
        <p id="description"></p >
    </div>

    <button onclick="inquiry()">Send Inquiry</button>

</div>

<!-- Lightbox（必须存在） -->
<div id="lightbox">
    <img id="lightboxImg">
</div>

<script>

/* =========================
产品数据（以后只改这里）
========================= */
const product = {
    id: "S-OC-001",
    name: "Outdoor Dining Chair",
    material: "Aluminum + Textilene",
    dimensions: "W58 × D62 × H88 cm",
    description: "Modern outdoor chair suitable for garden and patio use.",
    images: [
        "images/products/S-OC-001/1.jpg",
        "images/products/S-OC-001/2.jpg",
        "images/products/S-OC-001/3.jpg",
        "images/products/S-OC-001/4.jpg",
        "images/products/S-OC-001/5.jpg",
        "images/products/S-OC-001/6.jpg"
    ]
};

/* =========================
填充文字
========================= */
document.getElementById("title").innerText = product.name;
document.getElementById("code").innerText = product.id;
document.getElementById("material").innerText = product.material;
document.getElementById("dimensions").innerText = product.dimensions;
document.getElementById("description").innerText = product.description;

/* =========================
渲染图片
========================= */
const imgBox = document.getElementById("images");
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightboxImg");

product.images.forEach(src => {

    const box = document.createElement("div");
    box.className = "img-box";

    const img = document.createElement("img");
    img.src = src;

    img.onclick = () => {
        lightbox.style.display = "flex";
        lightboxImg.src = src;
    };

    box.appendChild(img);
    imgBox.appendChild(box);
});

/* =========================
关闭放大
========================= */
lightbox.onclick = () => {
    lightbox.style.display = "none";
};

/* =========================
询盘
========================= */
function inquiry() {
    alert("Inquiry sent for " + product.id);
}

</script>

</body>
</html>
