<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Detail - Sunburst Outdoor</title>
    <style>
        *{box-sizing: border-box;margin:0;padding:0;}
        body{max-width: 1200px;margin: 0 auto;padding: 20px;font-family: Arial,sans-serif;line-height: 1.6;}
        h1{margin: 20px 0;color: #333;font-size: 24px;}
        .img-gallery{display: flex;flex-wrap: wrap;gap: 15px;margin: 30px 0;}
        .img-gallery img{width: 280px;height: auto;border-radius: 4px;}
        .info-block{margin: 25px 0;}
        .info-block h3{color: #ff7700;margin-bottom: 8px;font-size: 18px;}
        .info-block p{color: #555;font-size: 16px;}
        .info-block ul{margin-left: 20px;color: #555;}
    </style>
</head>
<body>
    <div class="container">
        <h1 id="p-name"></h1>
        <div class="img-gallery" id="p-gallery"></div>

        <div class="info-block">
            <h3>Dimensions</h3>
            <p id="p-size"></p>
        </div>

        <div class="info-block">
            <h3>Material</h3>
            <p id="p-material"></p>
        </div>

        <div class="info-block">
            <h3>Description</h3>
            <p id="p-desc"></p>
        </div>

        <div class="info-block">
            <h3>Features</h3>
            <ul id="p-feature"></ul>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(location.search);
        const pid = params.get('id');

        fetch('./products.json')
        .then(res => res.json())
        .then(list => {
            let product = list.find(item => item.product_id === pid);
            if(!product){
                document.body.innerHTML = "<h2>Product Not Found</h2>";
                return;
            }

            document.getElementById('p-name').innerText = product.product_name;

            let imgArr = product.img_list.split(',');
            let gallery = document.getElementById('p-gallery');
            gallery.innerHTML = "";
            imgArr.forEach(src=>{
                let img = document.createElement('img');
                img.src = src.trim();
                gallery.appendChild(img);
            });

            document.getElementById('p-size').innerText = product.dimensions;
            document.getElementById('p-material').innerText = product.material;
            document.getElementById('p-desc').innerText = product.description;

            let featArr = product.features.split(',');
            let featUl = document.getElementById('p-feature');
            featUl.innerHTML = "";
            featArr.forEach(text=>{
                let li = document.createElement('li');
                li.innerText = text.trim();
                featUl.appendChild(li);
            });
        })
    </script>
</body>
</html>
