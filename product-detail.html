<!DOCTYPE html>
<html lang="en">
<head>
        <!-- 统一终极版 Favicon（所有页面通用） -->
<link rel="icon" href="https://sunburstltd.com/favicon.png?v=5" type="image/png">
<link rel="shortcut icon" href="https://sunburstltd.com/favicon.png?v=5" type="image/png">
<link rel="apple-touch-icon" href="https://sunburstltd.com/favicon.png?v=5">
<link rel="mask-icon" href="https://sunburstltd.com/favicon.png?v=5" color="#ffffff">
<meta name="theme-color" content="#ffffff">
<meta charset="UTF-8">
<title>Product Detail</title>

<style>
body {
    font-family: Arial;
    margin: 20px;
}

.container {
    max-width: 900px;
    margin: auto;
}

/* 标题 */
h1 { margin-bottom: 10px; }

/* 信息 */
.info { margin-top: 20px; }

/* 图片网格 */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 12px;
}

/* 图片盒子（无灰底版） */
.img-box {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #fff;
    border: 1px solid #eee;
    border-radius: 8px;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;
}

.img-box img {
    max-width: 90%;
    max-height: 90%;
    object-fit: contain;
    cursor: pointer;
    transition: 0.2s;
}

.img-box img:hover {
    transform: scale(1.05);
}

#lightbox img {
    max-width: 90%;
    max-height: 90%;
    object-fit: contain;
}

button {
    margin-top: 20px;
    padding: 10px 20px;
    background: black;
    color: white;
    border: none;
    cursor: pointer;
    border-radius: 4px;
}
    #inquiryModal * {
    font-family: Arial, Helvetica, sans-serif !important;
    box-sizing: border-box;
}

/* 统一输入框视觉 */
#inquiryModal input,
#inquiryModal textarea {
    width: 100%;
    margin: 0;
    padding: 12px 12px;
    border: 1px solid #e6e6e6;
    border-radius: 10px;

    font-size: 14px;
    color: #111;

    display: block;
}

/* 统一间距（关键） */
#inquiryModal input,
#inquiryModal textarea {
    margin-bottom: 10px;
}

/* placeholder统一 */
#inquiryModal input::placeholder,
#inquiryModal textarea::placeholder {
    color: #999;
}

/* textarea统一高度 */
#inquiryModal textarea {
    min-height: 90px;
    resize: none;
}

/* 禁用页面右键菜单 */
body {
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
}
body {
    pointer-events: auto;
}
body::selection {
    background: transparent;
}

/* 弹窗左右箭头样式 */
#lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    justify-content: center;
    align-items: center;
    gap: 12px;
    z-index: 9999;
}
.arrow {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(0,0,0,0.3);
    border: 2px solid #ff9158;
    color: #ff9158;
    font-size: 22px;
    cursor: pointer;
}
.arrow:hover {
    background: rgba(255,145,88,0.25);
}
.arrow:disabled {
    border-color: #666;
    color: #666;
    opacity: 0.3;
    cursor: not-allowed;
}
        
</style>
</head>

<body>

<div class="container">

    <h1 id="title"></h1>
    <p id="code"></p >

    <div class="grid" id="images"></div>

    <div class="info">
        <p><b>Material:</b> <span id="material"></span></p >
        <p><b>Dimensions:</b> <span id="dimensions"></span></p >
        <p id="description"></p >
    </div>

    <button onclick="openInquiry()">Send Inquiry</button>
</div>

<!-- Lightbox（必须） -->
<div id="lightbox">
    <button class="arrow prev-btn">&lt;</button>
    <img id="lightboxImg">
    <button class="arrow next-btn">&gt;</button>
</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const productId = urlParams.get("id");

if (!productId) {
    document.body.innerHTML = "<h2>No Product ID Found</h2>";
    throw new Error("Missing product ID");
}

let product = null;
let imgList = [];
let currentIndex = 0;
let lightbox;
let lightboxImg;

// =========================
// 1. 加载 JSON（GitHub Pages正确路径）
// =========================
fetch(`./data/products/${productId}.json`)
.then(res => {
    if (!res.ok) throw new Error("JSON not found");
    return res.json();
})
.then(data => {
    product = data;
    render();
})
.catch(err => {
    console.error(err);
    document.body.innerHTML = "<h2>Product Not Found</h2>";
});

// =========================
// 2. 渲染
// =========================
function render() {
    lightbox = document.getElementById("lightbox");
    lightboxImg = document.getElementById("lightboxImg");

    document.getElementById("title").innerText = product.name;
    document.getElementById("code").innerText = product.id;
    document.getElementById("material").innerText = product.material;
    document.getElementById("dimensions").innerText = product.dimensions;
    document.getElementById("description").innerText = product.description;

    const imgBox = document.getElementById("images");

    imgBox.innerHTML = "";

    const base = `./images/products/${product.id}/`;

imgList = [];

product.images.forEach((imgName, index) => {

    const wrapper = document.createElement("div");
    wrapper.className = "img-box";

    const img = document.createElement("img");
    img.crossOrigin = "anonymous";
    img.src = base + imgName;

    // ❗防404
img.onerror = () => {
img.src = "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(`
    <svg xmlns="http://www.w3.org/2000/svg" width="200" height="200">
        <rect width="100%" height="100%" fill="#f2f2f2"/>
        <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#999">
            Image Missing
        </text>
    </svg>
`);
};

img.onclick = () => {
    currentIndex = index;
    lightbox.style.display = "flex";
    lightboxImg.src = img.dataset.waterSrc || img.src;
    updateArrowState();
};

wrapper.appendChild(img);
imgBox.appendChild(wrapper);

imgList.push(img);
});

// 只绑定一次，点击黑色背景关闭弹窗
lightbox.onclick = (e) => {
    if (e.target === lightbox || e.target === lightboxImg) {
        lightbox.style.display = "none";
    }
};

}

// 【关键修复】把箭头状态更新函数移到全局，切换图片时实时刷新
function updateArrowState() {
    const prevBtn = document.querySelector(".prev-btn");
    const nextBtn = document.querySelector(".next-btn");
    prevBtn.disabled = currentIndex <= 0;
    nextBtn.disabled = currentIndex >= imgList.length - 1;
}

// =========================
// 3. 询盘
// =========================
function inquiry() {

    fetch("https://formspree.io/f/mjgddevd", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            product_id: product.id,
            product_name: product.name,
            url: window.location.href
        })
    })
    .then(async (res) => {

        const data = await res.json().catch(() => ({}));

        if (res.ok) {
            console.log("Formspree success:", data);
            alert("Inquiry sent for " + product.id);
        } else {
            console.error("Formspree failed:", data);
            alert("Failed to send inquiry");
        }
    })
    .catch(err => {
        console.error("Network error:", err);
        alert("Network error, not sent");
    });
}
    function openInquiry(){
    document.getElementById("inquiryModal").style.display = "flex";
}

function closeInquiry(){
    document.getElementById("inquiryModal").style.display = "none";
}

    function submitInquiry(){

    const name = document.getElementById("inq_name").value.trim();
    const email = document.getElementById("inq_email").value.trim();
    const country = document.getElementById("inq_country").value.trim();
    const msg = document.getElementById("inq_msg").value.trim();

    // ❗强制验证（必须填完）
    if(!name || !email || !country || !msg){
        alert("Please fill all fields");
        return;
    }

    fetch("https://formspree.io/f/mjgddevd", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            product_id: product.id,
            product_name: product.name,
            name: name,
            email: email,
            country: country,
            message: msg,
            page_url: window.location.href
        })
    })
    .then(res => {
        if(res.ok){
            alert("Inquiry sent successfully!");
            closeInquiry();
        }else{
            alert("Failed to send inquiry");
        }
    })
    .catch(err => {
        alert("Network error");
        console.log(err);
    });
}
    
</script>
    
    <div id="inquiryModal" style="
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.6);
    z-index:9999;
    justify-content:center;
    align-items:center;
">

  <div style="
      background:white;
      width:350px;
      padding:20px;
      border-radius:10px;
      font-family:Arial;
  ">

    <h3>Product Inquiry</h3>

    <input id="inq_name" placeholder="Name" style="width:100%;margin:5px 0;padding:8px;">
    <input id="inq_email" placeholder="Email" style="width:100%;margin:5px 0;padding:8px;">
    <input id="inq_country" placeholder="Country" style="width:100%;margin:5px 0;padding:8px;">
    <textarea id="inq_msg" placeholder="Message" style="width:100%;height:80px;margin:5px 0;padding:8px;"></textarea>

    <button onclick="submitInquiry()" style="
        width:100%;
        background:orange;
        color:white;
        padding:10px;
        border:none;
        margin-top:10px;
        cursor:pointer;
        font-weight:bold;
    ">Submit Inquiry</button>

    <button onclick="closeInquiry()" style="
        width:100%;
        margin-top:5px;
        padding:8px;
    ">Close</button>

  </div>

</div>

<script>
// 水印全局配置 完全原样保留
const WATERMARK_CONFIG = {
  text: "Sunburst Outdoor",
  opacity: 0.01,
  scalePercent: 6,
  rotate: -12
};

// 绘制水印函数
function runDraw(img) {
  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");
  canvas.width = img.naturalWidth;
  canvas.height = img.naturalHeight;

  ctx.drawImage(img, 0, 0);
  const fontSize = canvas.width * (WATERMARK_CONFIG.scalePercent / 100);

  ctx.save();
  ctx.translate(canvas.width / 2, canvas.height / 2);
  ctx.rotate(WATERMARK_CONFIG.rotate * Math.PI / 180);
  ctx.fillStyle = `rgba(255, 145, 88, ${WATERMARK_CONFIG.opacity})`;
  ctx.font = `bold ${fontSize}px Arial`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(WATERMARK_CONFIG.text, 0, 0);
  ctx.restore();

  return canvas.toDataURL("image/png");
}

function addWatermarkToImage(img) {

  if (img.dataset.watermarked === "1") return;
  img.dataset.watermarked = "1";
  img.crossOrigin = "anonymous";

  function process() {
    const waterSrc = runDraw(img);
    img.src = waterSrc;
    img.dataset.waterSrc = waterSrc;
  }

  if (img.complete && img.naturalWidth > 0) {
    process();
  } else {
    img.onload = process;
  }
}

// 监听动态加载的产品图
const observer = new MutationObserver(function(mutations) {
  mutations.forEach(function(mut) {

    mut.addedNodes.forEach(function(node) {
      if (node.tagName === "IMG" && node.closest(".img-box")) {
        addWatermarkToImage(node);
      }
      if (node.querySelectorAll) {
        node.querySelectorAll(".img-box img").forEach(addWatermarkToImage);
      }
    });
  });
});
observer.observe(document.body, { childList: true, subtree: true });

// 处理页面已有的产品缩略图
document.querySelectorAll(".img-box img").forEach(addWatermarkToImage);

// 页面加载完成后绑定左右箭头
document.addEventListener('DOMContentLoaded', function(){
    const prevBtn = document.querySelector(".prev-btn");
    const nextBtn = document.querySelector(".next-btn");

prevBtn.onclick = function(e) {
    e.stopPropagation();
    if (currentIndex > 0) {
        currentIndex--;
        lightboxImg.src = imgList[currentIndex].dataset.waterSrc || imgList[currentIndex].src;
    }
    updateArrowState();
};

nextBtn.onclick = function(e) {
    e.stopPropagation();
    if (currentIndex < imgList.length - 1) {
        currentIndex++;
        lightboxImg.src = imgList[currentIndex].dataset.waterSrc || imgList[currentIndex].src;
    }
    updateArrowState();
};
});
</script>
        
</body>
</html>
