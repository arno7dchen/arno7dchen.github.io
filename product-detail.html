<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Product Detail</title>

<style>
body {
    font-family: Arial;
    margin: 20px;
}

.container {
    max-width: 900px;
    margin: auto;
}

/* ===== 标题 ===== */
h1 {
    margin-bottom: 10px;
}

/* ===== 信息区 ===== */
.info {
    margin-top: 20px;
}

/* ===== 图片网格 ===== */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 12px;
}

/* ===== 图片统一框（关键）===== */
.grid-item {
    height: 180px;
    background: #f5f5f5;
    border-radius: 8px;
    overflow: hidden;

    display: flex;
    align-items: center;
    justify-content: center;
}

/* 图片本体 */
.grid-item img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    cursor: pointer;
    transition: transform 0.25s ease;
}

/* hover效果 */
.grid-item img:hover {
    transform: scale(1.05);
}

/* ===== 按钮 ===== */
button {
    margin-top: 20px;
    padding: 10px 20px;
    background: black;
    color: white;
    border: none;
    cursor: pointer;
    border-radius: 4px;
}

/* ===== Lightbox（放大层）===== */
#lightbox {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;

    background: rgba(0,0,0,0.85);

    justify-content: center;
    align-items: center;

    z-index: 9999;
}

#lightbox img {
    max-width: 90%;
    max-height: 90%;
    object-fit: contain;
}
</style>

</head>

<body>

<div class="container">

    <h1 id="title"></h1>
    <p id="code"></p >

    <div class="grid" id="images"></div>

    <div class="info">
        <p><b>Material:</b> <span id="material"></span></p >
        <p><b>Dimensions:</b> <span id="dimensions"></span></p >
        <p id="description"></p >
    </div>

    <button onclick="inquiry()">Send Inquiry</button>
</div>

<!-- ⭐ Lightbox 必须放在 body 最后 -->
<div id="lightbox">
    < img id="lightboxImg">
</div>

<script>

/* =========================
1. 产品数据（后面150个你只换这里）
========================= */
const product = {
    id: "S-OC-001",
    name: "Outdoor Dining Chair",
    material: "Aluminum + Textilene",
    dimensions: "W58 × D62 × H88 cm",
    description: "Modern outdoor chair suitable for garden and patio use.",
    images: [
        "images/products/S-OC-001/1.jpg",
        "images/products/S-OC-001/2.jpg",
        "images/products/S-OC-001/3.jpg",
        "images/products/S-OC-001/4.jpg",
        "images/products/S-OC-001/5.jpg",
        "images/products/S-OC-001/6.jpg"
    ]
};

/* =========================
2. 填充信息
========================= */
document.getElementById("title").innerText = product.name;
document.getElementById("code").innerText = product.id;
document.getElementById("material").innerText = product.material;
document.getElementById("dimensions").innerText = product.dimensions;
document.getElementById("description").innerText = product.description;

/* =========================
3. 图片渲染 + 点击放大
========================= */
const imgBox = document.getElementById("images");

const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightboxImg");

product.images.forEach(src => {

    const wrapper = document.createElement("div");
    wrapper.className = "grid-item";

    const img = document.createElement("img");
    img.src = src;

    img.onclick = () => {
        lightbox.style.display = "flex";
        lightboxImg.src = src;
    };

    wrapper.appendChild(img);
    imgBox.appendChild(wrapper);
});

/* =========================
4. 关闭放大
========================= */
lightbox.onclick = () => {
    lightbox.style.display = "none";
};

/* =========================
5. 询盘按钮
========================= */
function inquiry() {
    alert("Inquiry sent for " + product.id);
}

</script>

</body>
</html>
