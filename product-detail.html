<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Product Detail</title>

<style>
body {
    font-family: Arial;
    margin: 20px;
}

.container {
    max-width: 900px;
    margin: auto;
}

/* ===== 图片网格 ===== */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 12px;
}

/* 每张图统一容器（关键） */
.img-box {
    width: 100%;
    height: 160px;
    background: #fff; /* 去掉灰色问题 */
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid #eee;
}

/* 图片统一显示（不裁切、不变形） */
.img-box img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    cursor: pointer;
    transition: 0.2s;
}

.img-box img:hover {
    transform: scale(1.05);
}

/* 文字 */
h1 { margin-bottom: 6px; }
#code { color: #666; }

/* info */
.info {
    margin-top: 20px;
}

/* button */
button {
    margin-top: 20px;
    padding: 10px 20px;
    background: black;
    color: white;
    border: none;
    cursor: pointer;
}

/* ===== LIGHTBOX（重点修复）===== */
#lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    justify-content: center;
    align-items: center;
    z-index: 9999;
}

#lightbox img {
    max-width: 90%;
    max-height: 90%;
    object-fit: contain;
    background: white;
}
</style>
</head>

<body>

<div class="container">

    <h1 id="title"></h1>
    <div id="code"></div>

    <div class="grid" id="images"></div>

    <div class="info">
        <p><b>Material:</b> <span id="material"></span></p >
        <p><b>Dimensions:</b> <span id="dimensions"></span></p >
        <p id="description"></p >
    </div>

    <button onclick="inquiry()">Send Inquiry</button>
</div>

<!-- LIGHTBOX（必须在body里！否则你现在就是404/空） -->
<div id="lightbox">
    < img id="lightboxImg">
</div>

<script>
// =========================
// 1. 产品数据
// =========================
const product = {
    id: "S-OC-001",
    name: "Outdoor Dining Chair",
    material: "Aluminum + Textilene",
    dimensions: "W58 × D62 × H88 cm",
    description: "Modern outdoor chair suitable for garden and patio use.",
    images: [
        "images/products/S-OC-001/1.jpg",
        "images/products/S-OC-001/2.jpg",
        "images/products/S-OC-001/3.jpg",
        "images/products/S-OC-001/4.jpg",
        "images/products/S-OC-001/5.jpg",
        "images/products/S-OC-001/6.jpg"
    ]
};

// =========================
// 2. 基本信息
// =========================
document.getElementById("title").innerText = product.name;
document.getElementById("code").innerText = product.id;
document.getElementById("material").innerText = product.material;
document.getElementById("dimensions").innerText = product.dimensions;
document.getElementById("description").innerText = product.description;

// =========================
// 3. 图片渲染（核心修复）
// =========================
const imgBox = document.getElementById("images");
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightboxImg");

product.images.forEach(src => {

    const box = document.createElement("div");
    box.className = "img-box";

    const img = document.createElement("img");
    img.src = src;

    img.onclick = () => {
        lightbox.style.display = "flex";
        lightboxImg.src = src;
    };

    box.appendChild(img);
    imgBox.appendChild(box);
});

// =========================
// 4. 关闭放大
// =========================
lightbox.onclick = () => {
    lightbox.style.display = "none";
};

// =========================
// 5. inquiry
// =========================
function inquiry() {
    alert("Inquiry sent for " + product.id);
}
</script>

</body>
</html>
