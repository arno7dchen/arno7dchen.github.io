<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Auto Product JSON Generator</title>

<style>
body {
    font-family: Arial;
    padding: 20px;
    background: #f5f5f5;
}

.container {
    max-width: 900px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
}

h2 {
    margin-bottom: 10px;
}

input {
    padding: 8px;
    margin: 5px 0;
    width: 100%;
}

button {
    padding: 10px 15px;
    margin-top: 10px;
    cursor: pointer;
    background: black;
    color: white;
    border: none;
    border-radius: 6px;
}

.preview {
    margin-top: 20px;
    white-space: pre-wrap;
    background: #111;
    color: #0f0;
    padding: 10px;
    border-radius: 6px;
    font-size: 12px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 10px;
    margin-top: 15px;
}

.grid img {
    width: 100%;
    border-radius: 6px;
    border: 1px solid #ddd;
}
</style>
</head>

<body>

<div class="container">

<h2>🚀 Auto Product JSON Generator</h2>

<p>拖入产品文件夹（例如 S-OC-002）</p >

<input type="file" id="fileInput" accept="image/*" multiple>

<input id="productId" placeholder="Product ID (e.g. S-OC-002)">
<input id="name" placeholder="Product Name">
<input id="material" placeholder="Material">
<input id="dimensions" placeholder="Dimensions">
<input id="description" placeholder="Description">

<button onclick="generate()">Generate JSON</button>

<button onclick="downloadJSON()">Download JSON</button>

<div class="grid" id="previewImages"></div>

<pre class="preview" id="output"></pre>

</div>

<script>

let files = [];
let jsonData = null;

document.getElementById("folderInput").addEventListener("change", function(e) {
    files = Array.from(e.target.files);

    const preview = document.getElementById("previewImages");
    preview.innerHTML = "";

    files.sort((a,b) => a.name.localeCompare(b.name));

    files.forEach(file => {
        const img = document.createElement("img");
        img.src = URL.createObjectURL(file);
        preview.appendChild(img);
    });
});

function generate() {

    const id = document.getElementById("productId").value;

    const imageNames = files
        .map(f => f.name)
        .sort((a,b) => a.localeCompare(b));

    jsonData = {
        id: id,
        name: document.getElementById("name").value || "",
        material: document.getElementById("material").value || "",
        dimensions: document.getElementById("dimensions").value || "",
        description: document.getElementById("description").value || "",
        images: imageNames
    };

    document.getElementById("output").innerText =
        JSON.stringify(jsonData, null, 2);
}

function downloadJSON() {

    if (!jsonData) {
        alert("Please generate first");
        return;
    }

    const blob = new Blob(
        [JSON.stringify(jsonData, null, 2)],
        {type: "application/json"}
    );

    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = jsonData.id + ".json";
    a.click();
}

</script>

</body>
</html>
