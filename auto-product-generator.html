<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>完整自动产品生成器</title>

<style>
body {
    font-family: Arial;
    padding: 20px;
}

.drop-zone {
    border: 2px dashed #999;
    padding: 40px;
    text-align: center;
    margin-bottom: 20px;
    color: #666;
    border-radius: 10px;
}

.grid {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

.item {
    width: 120px;
    height: 120px;
    border: 1px solid #ddd;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    background: #f7f7f7;
}

.item img {
    max-width: 100%;
    max-height: 80px;
}

button {
    margin-top: 15px;
    padding: 10px 15px;
    background: black;
    color: white;
    border: none;
    cursor: pointer;
}

pre {
    margin-top: 20px;
    background: #f5f5f5;
    padding: 15px;
    white-space: pre-wrap;
}
</style>
</head>

<body>

<h2>🚀 完整自动产品生成器</h2>

<div class="drop-zone" id="dropZone">
拖拽产品图片到这里
</div>

<div class="grid" id="preview"></div>

<button onclick="generate()">生成完整JSON</button>

<pre id="output"></pre>

<script>

let files = [];

const dropZone = document.getElementById("dropZone");

dropZone.ondragover = e => e.preventDefault();

dropZone.ondrop = e => {
    e.preventDefault();

    const list = Array.from(e.dataTransfer.files);

    list.forEach(file => {
        if (file.type.startsWith("image")) {
            files.push(file);
        }
    });

    render();
};

function render() {
    const box = document.getElementById("preview");
    box.innerHTML = "";

    files.sort((a, b) => a.name.localeCompare(b.name));

    files.forEach(file => {
        const div = document.createElement("div");
        div.className = "item";

        const img = document.createElement("img");
        img.src = URL.createObjectURL(file);

        const name = document.createElement("div");
        name.innerText = file.name;

        div.appendChild(img);
        div.appendChild(name);

        box.appendChild(div);
    });
}

function generate() {

    const id = prompt("请输入产品ID（如 S-OC-001）");

    if (!id) return;

    const images = files
        .sort((a, b) => a.name.localeCompare(b.name))
        .map(f => f.name);

    const json = {
        id: id,

        // ⭐自动模板（关键）
        name: "Product Name",
        material: "Material (edit later)",
        dimensions: "Dimensions (edit later)",
        description: "Product description here",

        images: images
    };

    document.getElementById("output").innerText =
        JSON.stringify(json, null, 2);
}

</script>

</body>
</html>
